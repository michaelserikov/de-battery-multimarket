[project]
name = "bessmm"
version = "0.1.0"
description = "A battery across the German day-ahead, intraday and aFRR capacity markets: revenue stacking and sequential bidding"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "openpyxl>=3.1",
    "requests>=2.31",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
